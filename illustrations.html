  <body>
    <div class="site subpage">
      <header class="subpage-header subpage-header--wide">

          </nav>

          <header class="page-heading">
            <h1 id="sketchbook-heading">Иллюстрации</h1>
            <p>Скетчбук с&nbsp;набросками, персонажами и&nbsp;иллюстрациями разных лет. Откройте и&nbsp;листайте.</p>
          </header>

          <div class="book-stage">
            <div class="book is-side is-closed" data-book tabindex="0" role="group" aria-roledescription="блокнот" aria-label="Скетчбук Мари: листайте стрелками влево и вправо">
              <div class="book-turn">
                <div class="book-body">
                  <img class="book-photo" src="./assets/sketchbook/book-front.webp" alt="" width="570" height="816" decoding="async" draggable="false" />
                  <div class="book-board" aria-hidden="true"></div>
                  <div class="book-stack book-stack--right" data-book-stack="right" aria-hidden="true"></div>
                  <span class="book-ribbon" aria-hidden="true"></span>
                  <div class="book-leaves" data-book-leaves></div>
                  <div class="book-stack book-stack--left" data-book-stack="left" aria-hidden="true"></div>
                </div>
                <img class="book-side" src="./assets/sketchbook/book-side.webp" alt="" width="252" height="810" decoding="async" draggable="false" />
              </div>
            </div>
          </div>

          <div class="book-controls" role="group" aria-label="Листать скетчбук">
            <button class="book-arrow" type="button" aria-label="Предыдущая страница" data-book-prev>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            </button>
            <span class="book-counter" aria-live="polite" data-book-counter>Блокнот</span>
            <button class="book-arrow" type="button" aria-label="Следующая страница" data-book-next>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </div>
